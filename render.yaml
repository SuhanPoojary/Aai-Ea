# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: aegissupport-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        value: sqlite:///./aegissupport_dev.db
      - key: FRONTEND_ORIGIN
        value: https://aegissupport-frontend.onrender.com
      - key: SUPERVISOR_EMAIL
        sync: false
      - key: SUPERVISOR_PASSWORD
        sync: false
      - key: AEGIS_TOKEN_SECRET
        generateValue: true
      - key: GROQ_TIMEOUT_SECONDS
        value: "20"
      - key: GROQ_MAX_CONCURRENT_REQUESTS
        value: "8"
      - key: DETERMINISTIC_INTENT_ROUTING
        value: "true"
      - key: RAG_CACHE_TTL_SECONDS
        value: "300"
      - key: RAG_CACHE_MAX_ENTRIES
        value: "512"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: aegissupport-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://aegissupport-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
