services:
  postgres:
    image: postgres:16-alpine
    container_name: aegissupport-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegissupport
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_dev_password
    ports:
      - "5432:5432"
    volumes:
      - aegis_pgdata:/var/lib/postgresql/data
volumes:
  aegis_pgdata:
